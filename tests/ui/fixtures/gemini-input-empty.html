<!-- Input area of gemini.google.com/app, captured 2026-11-20 (German UI, signed out), trimmed:
     Angular attributes, SVGs and the model menu content removed; structure and classes kept. -->
<fieldset role="none" class="input-area-fieldset">
  <div xapfileselectordropzone="" class="text-input-field simplified-input-area">
    <div class="leading-actions-wrapper has-model-picker">
      <simplified-input-menu class="simplified-input-menu">
        <gem-icon-button class="menu-button gem-menu-button">
          <button class="mdc-icon-button mat-mdc-icon-button" aria-haspopup="menu" aria-label="Uploads&nbsp;&amp; Tools" aria-disabled="false"><gem-icon><mat-icon role="img" fonticon="plus" data-mat-icon-name="plus"></mat-icon></gem-icon></button>
        </gem-icon-button>
      </simplified-input-menu>
    </div>
    <div class="single-line-format">
      <div class="text-input-field-main-area">
        <div data-test-id="textarea-inner" class="text-input-field_textarea-inner">
          <div data-test-id="textarea-wrapper" class="textarea-wrapper">
            <rich-textarea class="text-input-field_textarea ql-container ql-bubble simplified-input" enterkeyhint="send" dir="ltr">
              <div class="ql-editor textarea new-input-ui rich-query-formatting-enabled ql-blank" data-gramm="false" contenteditable="true" dir="ltr" role="textbox" aria-multiline="true" aria-label="Einen Prompt für Gemini eingeben" data-placeholder="Frag Gemini"><p><br></p></div>
              <div class="ql-clipboard" contenteditable="true" tabindex="-1"></div>
            </rich-textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="trailing-actions-wrapper with-model-picker">
      <div class="model-picker-container">
        <bard-mode-switcher><button data-test-id="bard-mode-menu-button" class="mdc-button input-area-switch" type="button" aria-label="Modusauswahl öffnen, derzeit ausgewählt: Automatic"><span>Automatic</span></button></bard-mode-switcher>
      </div>
      <div class="input-buttons-wrapper-bottom persistent-mic">
        <div class="mic-button-container persistent-mic">
          <speech-dictation-mic-button class="speech-dictation-mic-button">
            <button class="mdc-icon-button mat-mdc-icon-button" aria-label="Spracheingabe (^⇧D)" aria-pressed="false" aria-disabled="false"><mat-icon role="img" fonticon="mic" data-mat-icon-name="mic"></mat-icon></button>
          </speech-dictation-mic-button>
        </div>
      </div>
    </div>
  </div>
</fieldset>
