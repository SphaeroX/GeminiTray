<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Gemini Tray</title>
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3A3FB8"/>
      <stop offset="0.5" stop-color="#20236A"/>
      <stop offset="1" stop-color="#11133A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#8EA2FF" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#6C7BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6C7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#5EE7FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5EE7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7CF0FF"/>
      <stop offset="0.38" stop-color="#6E9CFF"/>
      <stop offset="0.72" stop-color="#B07CFF"/>
      <stop offset="1" stop-color="#FF86C0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CF0FF"/>
      <stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="clip"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="430" r="440" fill="url(#glow)"/>
    <ellipse cx="512" cy="780" rx="280" ry="150" fill="url(#beam)"/>
  </g>
  <rect x="67" y="67" width="890" height="890" rx="205" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- spark rising from the tray -->
  <path d="M512 168 C536 336 596 400 776 424 C596 448 536 512 512 680 C488 512 428 448 248 424 C428 400 488 336 512 168 Z" fill="url(#spark)"/>
  <circle cx="512" cy="424" r="120" fill="url(#core)"/>
  <!-- companion spark -->
  <path d="M752 196 C758 240 774 256 818 262 C774 268 758 284 752 328 C746 284 730 268 686 262 C730 256 746 240 752 196 Z" fill="#FFFFFF" opacity="0.92"/>
  <!-- the tray -->
  <rect x="292" y="782" width="440" height="48" rx="24" fill="url(#tray)"/>
</svg>
