[package]
name = "gemini-tray"
version = "2.0.0"
description = "Google Gemini in the Windows system tray"
authors = ["SphaeroX"]
license = "MIT"
edition = "2024"

[lib]
name = "gemini_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.2", features = ["json"] }
tungstenite = "0.30.0"
url = "2.5.8"
cookie = "0.18"
tauri-plugin-autostart = "2"
sys-locale = "0.3.2"
base64 = "0.23.1"
parakeet-rs = "0.4"
sha2 = "0.11.1"
cpal = "0.18.2"
tauri-plugin-clipboard-manager = "2"
xcap = "0.9.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[[test]]
name = "window_toggle"
path = "../tests/rust/window_toggle.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"
xcap = "0.9.10"

[[test]]
name = "login"
path = "../tests/rust/login.rs"

[[test]]
name = "settings"
path = "../tests/rust/settings.rs"

[[test]]
name = "bridge"
path = "../tests/rust/bridge.rs"

[[test]]
name = "stt"
path = "../tests/rust/stt.rs"

[[test]]
name = "voice"
path = "../tests/rust/voice.rs"

[[test]]
name = "voice_message"
path = "../tests/rust/voice_message.rs"

[[test]]
name = "screenshot"
path = "../tests/rust/screenshot.rs"
