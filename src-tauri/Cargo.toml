[package]
name = "gemini-tray"
version = "2.0.0"
description = "Google Gemini in the Windows system tray"
authors = ["SphaeroX"]
license = "MIT"
edition = "2024"

[lib]
name = "gemini_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
webview2-com = "0.39"
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.2", features = ["json"] }
tungstenite = "0.30.0"
url = "2.5.8"
cookie = "0.18"
tauri-plugin-autostart = "2"
sys-locale = "0.3.2"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2"
xcap = "0.9.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "window_toggle"
path = "../tests/rust/window_toggle.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image capture/encoding is far too slow unoptimized; keep `tauri dev` snappy.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.xcap]
opt-level = 3

[dev-dependencies]
xcap = "0.9.10"

[[test]]
name = "login"
path = "../tests/rust/login.rs"

[[test]]
name = "settings"
path = "../tests/rust/settings.rs"

[[test]]
name = "bridge"
path = "../tests/rust/bridge.rs"


[[test]]
name = "voice"
path = "../tests/rust/voice.rs"

[[test]]
name = "voice_message"
path = "../tests/rust/voice_message.rs"

[[test]]
name = "screenshot"
path = "../tests/rust/screenshot.rs"

[[test]]
name = "prompts"
path = "../tests/rust/prompts.rs"

[[test]]
name = "windowstate"
path = "../tests/rust/windowstate.rs"

[[test]]
name = "updates"
path = "../tests/rust/updates.rs"
