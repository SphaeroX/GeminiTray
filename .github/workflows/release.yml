name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run version:check

      - name: Tests
        run: npm test

      # Updater artifacts (signature + latest.json) need the signing key; without it only the
      # installer is published and the in-app updater stays disabled.
      - name: Updater artifacts only with signing key
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
            echo 'json=true' >> "$GITHUB_OUTPUT"
          else
            echo 'json=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gemini Tray ${{ github.ref_name }}
          releaseBody: |
            See the commit history for changes.

            **Upgrading from 1.x:** uninstall Gemini Tray 1.x first, then run the installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.json == 'true' }}
          args: ${{ steps.updater.outputs.args }}
